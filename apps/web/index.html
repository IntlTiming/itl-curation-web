<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITL Curation</title>
    <script>
      // Applied before React mounts so there's no flash of the wrong theme
      // on load. Keep storageKey in sync with theme-provider.tsx.
      (function () {
        var storageKey = 'itl-curation-theme';
        var theme = localStorage.getItem(storageKey) || 'dark';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
